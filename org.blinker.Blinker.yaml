id: org.blinker.Blinker
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: blinker
rename-icon: blinker
rename-desktop-file: app.desktop
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=ipc
  # - --share=network
  - --env=GTK_THEME=Adwaita:dark

modules:
  - name: blinker
    buildsystem: simple
    build-commands:
      - install -Dm755 blinker /app/bin/blinker
    post-install:
      - install -Dm644 ./app.desktop ${FLATPAK_DEST}/share/applications/app.desktop
      - install -Dm644 ./icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/blinker.svg
    sources:
      - type: file
        path: src-tauri/target/release/blinker
      - type: file
        path: ./public/icon.svg
      - type: file
        path: ./app.desktop
