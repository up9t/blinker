on:
  push:
    tags:
      - "v*"

env:
  APP_NAME: blinker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
            toolchain: stable

      - name: Cache rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: "25"

      - name: Install application dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit
        run: npm audit

      - name: Install Tauri dependencies (debian)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build application
        run: npm run tauri build

      - name: Create SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.json
      
      - name: Create the binary archive
        run: tar -c --xz -f ${{ env.APP_NAME }}.tar.xz --directory=./src-tauri/target/release ${{ env.APP_NAME }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        id: upload-artifact
        with:
          name: linux-packages
          path: |
            ./sbom.json
            ./${{ env.APP_NAME }}.tar.xz
            ./src-tauri/target/release/bundle/appimage/${{ env.APP_NAME }}*.AppImage
            ./src-tauri/target/release/bundle/rpm/${{ env.APP_NAME }}*.rpm
            ./src-tauri/target/release/bundle/deb/${{ env.APP_NAME }}*.deb

  flatpak:
    runs-on: ubuntu-latest
    needs:
      - build
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    permissions:
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        id: download-artifact
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}

      - name: Extract
        env:
          LOOK_DIR: ./src-tauri/target/release
        run: |
          mkdir -p ${{ env.LOOK_DIR }}
          tar -x --directory=${{ env.LOOK_DIR }} -f ${{ env.APP_NAME }}.tar.xz

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.APP_NAME }}.flatpak
          manifest-path: org.blinker.Blinker.yaml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        id: upload-artifact
        # retention-days: 1
        with:
          name: flatpak-package
          path: |
            ./${{ env.APP_NAME }}.flatpak

  release:
    runs-on: ubuntu-slim
    needs:
      - build
      - flatpak
    permissions:
      contents: write
    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        id: download-artifact
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }},${{ needs.flatpak.outputs.artifact-id }}

      # - name: Attest Build Provenance
      #   uses: actions/attest-build-provenance@v4
      #   with:
      #     subject-name: linux-packages
      #     subject-digest: sha256:${{ steps.upload-artifact.outputs.artifact-digest }}

      - name: GH Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.download-artifact.outputs.download-path }}/**/*

